# Tests and builds. Runs on pull requests to main and on pushes to main,
# and is called by release.yml to build the release assets.
#
# Assets (artifact "release-assets"):
#   vericounts-<version>-x86_64-linux.tar.gz, ...-aarch64-linux.tar.gz
#     static server binary (bin/) and the built web client (web/)
#   vericounts-<version>.tgz   Helm chart
#   setup.sh                   installer
#   SHA256SUMS

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; the triggering commit by default
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP server that keeps what it receives, for the sign-in code test.
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      VERICOUNTS_TEST_SMTP_URL: smtp://127.0.0.1:1025
      VERICOUNTS_TEST_MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install xmllint, used to validate XML against the AEAT schemas
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web client
        working-directory: web
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check the installer
        run: shellcheck setup.sh docker/initdb/*.sh
      - name: Check the Helm chart
        run: |
          helm lint charts/vericounts
          helm template test charts/vericounts > /dev/null \
            --set publicUrl=https://books.example.com \
            --set database.url=postgres://app@db/vericounts \
            --set database.migrationUrl=postgres://owner@db/vericounts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist
          if-no-files-found: error

  server:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install musl, for a static binary that runs on any Linux
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          command -v rustup || curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustup" target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.arch }}
      - name: Build
        run: |
          cargo build --release --locked -p vericounts-server --target ${{ matrix.arch }}-unknown-linux-musl
          mkdir -p out
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vericounts-server out/
          strip out/vericounts-server
          file out/vericounts-server
          ./out/vericounts-server version
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: out/vericounts-server
          if-no-files-found: error

  package:
    needs: [test, web, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          version=$(scripts/version.sh)
          mkdir -p assets
          for arch in x86_64 aarch64; do
            root="pkg-$arch/vericounts"
            mkdir -p "$root/bin"
            install -m 0755 "artifacts/server-$arch/vericounts-server" "$root/bin/"
            cp -r artifacts/web "$root/web"
            cp README.md "$root/"
            echo "$version" > "$root/VERSION"
            tar -C "pkg-$arch" -czf "assets/vericounts-$version-$arch-linux.tar.gz" vericounts
          done
          helm package charts/vericounts --destination assets
          cp setup.sh assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets
          if-no-files-found: error
