<script :setup="{
  variant = 'secondary',
  size = 'md',
  type = 'button',
  disabled = false,
  loading = false,
  block = false,
  label = ''
}: ButtonProps" lang="ts">
  // A button. `variant` is what it does: `primary` is the one thing a view
  // asks for, `secondary` the rest, `ghost` an action that should not
  // compete with the content, `danger` one that cannot be undone (cancel an
  // invoice, go live).
  //
  //   <Button variant="primary" @click="issue()">{{ t.form.issue }}</Button>
  //   <Button :loading="saving" block>{{ t.save }}</Button>
  //
  // `click` is re-emitted with the native event in `$event.detail`, and not
  // while disabled or loading. `label` names a button whose content is only
  // an icon. Part of the theme: imports nothing, draws only with tokens.
  interface ButtonProps {
    variant?: "primary" | "secondary" | "ghost" | "danger"
    size?: "sm" | "md" | "lg"
    type?: "button" | "submit" | "reset"
    disabled?: boolean | ""
    loading?: boolean | ""
    block?: boolean | ""
    label?: string
  }

  // A bare attribute (`<Button disabled>`) arrives as "", and means on.
  const flag = (value: unknown) => value === "" || value === true || value === "true"
  $: isDisabled = flag(disabled)
  $: isLoading = flag(loading)

  const click = (event: Event) => {
    if (isDisabled || isLoading) return
    $emit("click", event)
  }
</script>

<button class="button"
        :type="type"
        :class.primary="variant === 'primary'"
        :class.ghost="variant === 'ghost'"
        :class.danger="variant === 'danger'"
        :class.sm="size === 'sm'"
        :class.lg="size === 'lg'"
        :class.block="flag(block)"
        :class.loading="isLoading"
        :disabled="isDisabled"
        :aria-busy="isLoading ? 'true' : null"
        :aria-label="label || null"
        @click="click($event)">
  <span :if="isLoading" class="spin" aria-hidden="true"></span>
  <span class="content"><slot></slot></span>
</button>
