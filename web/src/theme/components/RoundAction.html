<script :setup="{ label = '', icon = '', variant = 'secondary', disabled = false }: RoundActionProps" lang="ts">
  // A round button with its label underneath, in a row of the main things
  // a screen lets you do: new invoice, new contact, send now. `icon` is an
  // SVG path in a 24×24 box, drawn with a stroke. `primary` fills it with
  // the accent. Emits `click`.
  //
  //   <RoundAction :label="t.list.newInvoice" :icon="ICONS.plus" variant="primary" @click="showNew()" />
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface RoundActionProps {
    label?: string
    icon?: string
    variant?: "primary" | "secondary"
    disabled?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  const click = (event: Event) => {
    if (!flag(disabled)) $emit("click", event)
  }
</script>

<button type="button" class="action" :class.primary="variant === 'primary'" :disabled="flag(disabled)" @click="click($event)">
  <span class="circle" aria-hidden="true"><svg viewBox="0 0 24 24"><path :d="icon" /></svg></span>
  <span class="label">{{ label }}</span>
</button>
