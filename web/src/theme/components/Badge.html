<script :setup="{ tone = 'neutral', dot = false }: BadgeProps" lang="ts">
  // A short label beside something: the AEAT state of an invoice, a role,
  // "inactiva". `tone` says how it is going: `ok`, `warn`, `bad`, `accent`
  // or `neutral`. `dot` puts a dot before the text, for a state.
  //
  //   <Badge tone="ok" dot>{{ t.aeatState.accepted }}</Badge>
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface BadgeProps {
    tone?: "neutral" | "accent" | "ok" | "warn" | "bad"
    dot?: boolean | ""
  }
  const flag = (value: unknown) => value === "" || value === true || value === "true"
</script>

<span class="badge" :class="'tone-' + tone">
  <span :if="flag(dot)" class="dot" aria-hidden="true"></span><slot></slot>
</span>
