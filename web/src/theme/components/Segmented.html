<script :setup="{ model = '', options = [], label = '' }: SegmentedProps" lang="ts">
  // A few choices side by side, one of them on: a quarter, all/pending
  // invoices, customer/supplier. `options` are `{ value, label }`; the value
  // goes up through `:model` and as `change`. `label` names the group for a
  // screen reader.
  //
  //   <Segmented :model="quarter" :options="quarters" :label="t.home.quarterPicker" />
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface Option { value: string; label: string }
  interface SegmentedProps {
    model?: string
    options?: Option[]
    label?: string
  }
  const choose = (value: string) => {
    if (value === model) return
    $updateModel(value)
    $emit("change", value)
  }
</script>

<div class="segmented" role="radiogroup" :aria-label="label || null">
  <button :each="option in options" :key="option.value" type="button" class="segment"
          role="radio" :aria-checked="option.value === model ? 'true' : 'false'"
          :class.on="option.value === model" @click="choose(option.value)">{{ option.label }}</button>
</div>
