<script :setup="{ title = '', subtitle = '', padded = true }: CardProps" lang="ts">
  // A white card on the grey page: one thing. A head when there is a
  // `title` or something in the `actions` slot, the content, and a foot
  // when the `foot` slot has something.
  //
  //   <Card :title="t.settings.seriesTitle">
  //     <template :slot.actions><Button size="sm" variant="ghost">…</Button></template>
  //     …
  //     <template :slot.foot>…</template>
  //   </Card>
  //
  // `padded="false"` for a list of entries, which pad themselves. Part of
  // the theme: imports nothing, draws only with tokens.
  interface CardProps {
    title?: string
    subtitle?: string
    padded?: boolean | ""
  }
  const flag = (value: unknown) => value === "" || value === true || value === "true"
</script>

<section class="card">
  <header :if="title || $slots.actions" class="head">
    <div class="titles">
      <h3 :if="title" class="title">{{ title }}</h3>
      <p :if="subtitle" class="subtitle">{{ subtitle }}</p>
    </div>
    <div :if="$slots.actions" class="actions"><slot.actions /></div>
  </header>
  <div class="body" :class.padded="flag(padded)"><slot></slot></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</section>
