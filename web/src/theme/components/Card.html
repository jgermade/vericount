<script :setup="{ title = '', subtitle = '', ruled = false, padded = true }: CardProps" lang="ts">
  // A sheet on the desk: one thing, with a head when there is a `title` or
  // something in the `actions` slot, and a foot when the `foot` slot has
  // something. `ruled` turns it into a ledger page: hairlines and the red
  // double rule of the margin, for lists of entries and the printable
  // invoice.
  //
  //   <Card :title="t.settings.seriesTitle">
  //     <template :slot.actions><Button size="sm">…</Button></template>
  //     …
  //     <template :slot.foot>…</template>
  //   </Card>
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface CardProps {
    title?: string
    subtitle?: string
    ruled?: boolean | ""
    padded?: boolean | ""
  }
  const flag = (value: unknown) => value === "" || value === true || value === "true"
</script>

<section class="card" :class.ruled="flag(ruled)">
  <header :if="title || $slots.actions" class="head">
    <div class="titles">
      <h3 :if="title" class="title">{{ title }}</h3>
      <p :if="subtitle" class="subtitle">{{ subtitle }}</p>
    </div>
    <div :if="$slots.actions" class="actions"><slot.actions /></div>
  </header>
  <div class="body" :class.padded="flag(padded)"><slot></slot></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</section>
