<script :setup="{ model = false, disabled = false }: CheckboxProps" lang="ts">
  // A yes or no, with its label in the slot: "Cliente", "Proveedor". The
  // box is ticked like a ledger's check column. The value goes up through
  // `:model` and as `change`.
  //
  //   <Checkbox :model="contact.is_customer">{{ t.contacts.customer }}</Checkbox>
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface CheckboxProps {
    model?: boolean
    disabled?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  const toggled = (event: Event) => {
    const value = (event.target as HTMLInputElement).checked
    $updateModel(value)
    $emit("change", value)
  }
</script>

<label class="check" :class.disabled="flag(disabled)">
  <input type="checkbox" class="native" :checked="!!model" :disabled="flag(disabled)" @change="toggled($event)">
  <span class="box" aria-hidden="true">
    <svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></svg>
  </span>
  <span class="text"><slot></slot></span>
</label>
