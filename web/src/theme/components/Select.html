<script :setup="{ model = '', options = [], placeholder = '', required = false, disabled = false, invalid = false }: SelectProps" lang="ts">
  // One choice from a list: a customer, a series. The native control, so
  // the phone shows its own picker, drawn as the theme's box. `options` are
  // `{ value, label }`; `placeholder` is an empty first option that cannot
  // be chosen again.
  //
  //   <Select :model="form.contact_id" :options="customers" :placeholder="t.form.chooseCustomer" required />
  //
  // The value goes up through `:model` and as `change`, as a string. Part
  // of the theme: imports nothing, draws only with tokens.
  interface Option { value: string | number; label: string }
  interface SelectProps {
    model?: string | number
    options?: Option[]
    placeholder?: string
    required?: boolean | ""
    disabled?: boolean | ""
    invalid?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  const chosen = (event: Event) => {
    const value = (event.target as HTMLSelectElement).value
    $updateModel(value)
    $emit("change", value)
  }
</script>

<span class="box" :class.invalid="flag(invalid)">
  <select class="select"
          :required="flag(required)"
          :disabled="flag(disabled)"
          :aria-invalid="flag(invalid) ? 'true' : null"
          @change="chosen($event)">
    <option :if="placeholder" value="" disabled :selected="model === '' || model == null">{{ placeholder }}</option>
    <option :each="option in options" :key="option.value" :value="option.value"
            :selected="String(option.value) === String(model)">{{ option.label }}</option>
  </select>
  <svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
</span>
