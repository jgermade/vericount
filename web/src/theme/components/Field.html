<script :setup="{ label = '', hint = '', error = '', optional = '' }: FieldProps" lang="ts">
  // A labelled control: the label above, the control in the slot, and under
  // it a hint or, when there is one, the error, which takes its place. The
  // whole field is a <label>, so tapping the label focuses the control.
  //
  //   <Field :label="t.settings.nif" :hint="t.settings.nifHint" :error="errors.nif">
  //     <TextInput :model="company.nif" maxlength="9" />
  //   </Field>
  //
  // `optional` is a word after the label ("opcional"), passed in like every
  // text. Part of the theme: imports nothing, draws only with tokens.
  interface FieldProps {
    label?: string
    hint?: string
    error?: string
    optional?: string
  }
</script>

<label class="field" :class.invalid="!!error">
  <span class="label">{{ label }}<span :if="optional" class="optional">{{ optional }}</span></span>
  <slot></slot>
  <span :if="error" class="error" role="alert">{{ error }}</span>
  <span :elseif="hint" class="hint">{{ hint }}</span>
</label>
