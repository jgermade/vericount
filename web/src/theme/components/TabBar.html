<script :setup="{ model = '', items = [], label = '' }: TabBarProps" lang="ts">
  // The app's sections at the foot of the screen, where a thumb reaches.
  // Each item is `{ value, label, icon }`, the icon an SVG path in a 24×24
  // box drawn with a stroke. The one that is on carries a block above it,
  // the block of the logo. The value goes up through `:model` and as
  // `change`.
  //
  //   <TabBar :model="view" :items="sections" :label="t.nav.label" @change="go($event.detail)" />
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface TabItem { value: string; label: string; icon: string }
  interface TabBarProps {
    model?: string
    items?: TabItem[]
    label?: string
  }
  const choose = (value: string) => {
    $updateModel(value)
    $emit("change", value)
  }
</script>

<nav class="bar" :aria-label="label || null">
  <button :each="item in items" :key="item.value" type="button" class="tab" :class.on="item.value === model"
          :aria-current="item.value === model ? 'page' : null" @click="choose(item.value)">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path :d="item.icon" /></svg>
    <span class="label">{{ item.label }}</span>
  </button>
</nav>
