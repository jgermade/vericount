<script :setup="{ tone = 'accent', title = '' }: AlertProps" lang="ts">
  // A message about the view around it, as a soft card. `tone` is how much
  // it matters: `accent` to say something, `ok` that something went well,
  // `warn` that something needs attention (practice mode, pending
  // records), `bad` that something failed.
  //
  //   <Alert tone="warn" :title="t.list.practiceTitle">{{ t.list.practice }}</Alert>
  //
  // `bad` is announced as an alert, the rest as a status. Part of the theme:
  // imports nothing, draws only with tokens.
  interface AlertProps {
    tone?: "accent" | "ok" | "warn" | "bad"
    title?: string
  }
</script>

<div class="alert" :class="'tone-' + tone" :role="tone === 'bad' ? 'alert' : 'status'">

  </span>
  <div class="text">
    <strong :if="title" class="title">{{ title }}</strong>
    <div class="body"><slot></slot></div>
  </div>
</div>
