<script :setup="{ title = '', subtitle = '', initials = '', tone = 'neutral', interactive = false }: EntryProps" lang="ts">
  // A row of a list: an invoice, a contact, a series. A round avatar on the
  // left (`initials`, or an icon in the `icon` slot), title and subtitle,
  // badges after the title in the `tags` slot, and the figure on the right
  // in the `aside` slot. `tone` colours the avatar.
  //
  //   <Entry :title="item.recipient_name" :subtitle="item.series_number"
  //          :initials="initialsOf(item.recipient_name)" interactive @click="open(item.id)">
  //     <template :slot.tags><Badge tone="ok" dot>…</Badge></template>
  //     <template :slot.aside><Amount :amount="item.total_amount" /></template>
  //   </Entry>
  //
  // `interactive` makes the whole row a button that emits `click`. Put
  // entries in a Card with `padded="false"`. Part of the theme: imports
  // nothing, draws only with tokens.
  interface EntryProps {
    title?: string
    subtitle?: string
    initials?: string
    tone?: "neutral" | "accent" | "ok" | "warn" | "bad"
    interactive?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  $: isInteractive = flag(interactive)
  const click = (event: Event) => {
    if (isInteractive) $emit("click", event)
  }
</script>

<button :if="isInteractive" type="button" class="entry interactive" @click="click($event)">
  <span :if="initials || $slots.icon" class="avatar" :class="'tone-' + tone" aria-hidden="true">
    <slot.icon>{{ initials }}</slot.icon>
  </span>
  <span class="main">
    <span class="title-line"><span class="title">{{ title }}</span><slot.tags /></span>
    <span :if="subtitle" class="subtitle">{{ subtitle }}</span>
    <slot></slot>
  </span>
  <span :if="$slots.aside" class="aside"><slot.aside /></span>
</button>
<div :else class="entry">
  <span :if="initials || $slots.icon" class="avatar" :class="'tone-' + tone" aria-hidden="true">
    <slot.icon>{{ initials }}</slot.icon>
  </span>
  <span class="main">
    <span class="title-line"><span class="title">{{ title }}</span><slot.tags /></span>
    <span :if="subtitle" class="subtitle">{{ subtitle }}</span>
    <slot></slot>
  </span>
  <span :if="$slots.aside" class="aside"><slot.aside /></span>
</div>
