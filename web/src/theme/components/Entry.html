<script :setup="{ title = '', subtitle = '', interactive = false }: EntryProps" lang="ts">
  // One line of a ledger: an invoice, a contact, a series. Title and a
  // subtitle on the left, badges after the title in the `tags` slot, and
  // the figure on the right in the `aside` slot, aligned with the figures
  // of the lines above and below. Lines are ruled by hairlines.
  //
  //   <Entry :title="item.series_number" :subtitle="item.recipient_name" interactive
  //          @click="open(item.id)">
  //     <template :slot.tags><Badge tone="ok" dot>…</Badge></template>
  //     <template :slot.aside><Amount :value="item.total_amount" /></template>
  //   </Entry>
  //
  // `interactive` makes the whole line a button that emits `click`. Put
  // entries in a plain `<ul>`/`<div>`: each draws its own rule. Part of the
  // theme: imports nothing, draws only with tokens.
  interface EntryProps {
    title?: string
    subtitle?: string
    interactive?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  $: isInteractive = flag(interactive)
  const click = (event: Event) => {
    if (isInteractive) $emit("click", event)
  }
</script>

<button :if="isInteractive" type="button" class="entry interactive" @click="click($event)">
  <span class="main">
    <span class="title-line"><strong class="title">{{ title }}</strong><slot.tags /></span>
    <span :if="subtitle" class="subtitle">{{ subtitle }}</span>
    <slot></slot>
  </span>
  <span :if="$slots.aside" class="aside"><slot.aside /></span>
  <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" /></svg>
</button>
<div :else class="entry">
  <span class="main">
    <span class="title-line"><strong class="title">{{ title }}</strong><slot.tags /></span>
    <span :if="subtitle" class="subtitle">{{ subtitle }}</span>
    <slot></slot>
  </span>
  <span :if="$slots.aside" class="aside"><slot.aside /></span>
</div>
