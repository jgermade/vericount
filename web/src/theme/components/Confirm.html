<script :setup="{ tone = 'bad', confirm = '', cancel = '', busy = false }: ConfirmProps" lang="ts">
  // The question before something that cannot be undone, in place, where
  // the button was: cancel an invoice, remove a user, go live. The question
  // in the slot, two answers under it. Emits `confirm` or `cancel`; the
  // owner decides when it goes away.
  //
  //   <Confirm :if="confirmingCancel" :confirm="t.detail.confirm" :cancel="t.detail.keep"
  //            @confirm="cancelInvoice()" @cancel="confirmingCancel = false">
  //     {{ t.detail.confirmCancel(invoice.series_number) }}
  //   </Confirm>
  //
  // The answer that keeps things as they are gets the focus, so Enter does
  // no harm. Part of the theme: imports nothing, draws only with tokens.
  interface ConfirmProps {
    tone?: "bad" | "warn" | "accent"
    confirm?: string
    cancel?: string
    busy?: boolean | ""
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  await $mounted()
  $self<HTMLButtonElement>(".keep")?.focus()
</script>

<div class="confirm" :class="'tone-' + tone" role="alertdialog">
  <div class="question"><slot></slot></div>
  <div class="answers">
    <button type="button" class="answer go" :disabled="flag(busy)" @click="$emit('confirm')">{{ confirm }}</button>
    <button type="button" class="answer keep" :disabled="flag(busy)" @click="$emit('cancel')">{{ cancel }}</button>
  </div>
</div>
