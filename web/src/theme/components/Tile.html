<script :setup="{ label = '', hint = '', tone = 'neutral' }: TileProps" lang="ts">
  // One figure with what it is: invoiced this quarter, VAT, invoices issued.
  // The figure goes in the slot (an Amount, or a plain number); `hint` is a
  // line under it. `tone` colours the hint, to point at a figure that needs
  // attention.
  //
  //   <Tile :label="t.home.invoiced"><Amount :amount="summary.total_base" /></Tile>
  //
  // Part of the theme: imports nothing, draws only with tokens.
  interface TileProps {
    label?: string
    hint?: string
    tone?: "neutral" | "accent" | "ok" | "warn" | "bad"
  }
</script>

<div class="tile" :class="'tone-' + tone">
  <span class="label">{{ label }}</span>
  <span class="figure"><slot></slot></span>
  <span :if="hint" class="hint">{{ hint }}</span>
</div>
