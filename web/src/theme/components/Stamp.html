<script :setup="{ tone = 'bad', size = 'md', flat = false }: StampProps" lang="ts">
  // A rubber stamp on the paper: what an invoice is, in a word that cannot
  // be missed. ANULADA in red, FACTURA DE PRUEBA in ochre, VERIFICADA in
  // green. Slightly tilted and inked through, as a real one; `flat` keeps
  // it straight, for a narrow place or print.
  //
  //   <Stamp :if="invoice.cancelled">{{ t.print.cancelled }}</Stamp>
  //   <Stamp tone="warn" :if="!invoice.live">{{ t.print.practice }}</Stamp>
  //
  // It prints too: the colours are forced in print, where browsers would
  // otherwise drop them. Part of the theme: imports nothing, draws only with
  // tokens.
  interface StampProps {
    tone?: "bad" | "warn" | "ok" | "accent" | "ink"
    size?: "sm" | "md" | "lg"
    flat?: boolean | ""
  }
  const flag = (value: unknown) => value === "" || value === true || value === "true"
</script>

<span class="stamp" :class="'tone-' + tone + ' size-' + size" :class.flat="flag(flat)">
  <span class="inner"><slot></slot></span>
</span>
