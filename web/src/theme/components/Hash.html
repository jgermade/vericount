<script :setup="{ hash = '', full = false, empty = '—' }: HashProps" lang="ts">
  // A record's hash, the link of the chain: 64 hexadecimal digits in groups
  // of four, so two can be compared by eye. Short by default, the first two
  // groups and the last; `full` shows all of them, wrapping. The whole value
  // is always in the tooltip and is what is copied.
  //
  //   <Hash :hash="record.hash" />
  //   <Hash :hash="record.previous_hash" :empty="t.detail.firstRecord" />
  //
  // `empty` is what a missing hash says: the first record of a chain has no
  // previous one. Part of the theme: imports nothing, draws only with tokens.
  interface HashProps {
    hash?: string
    full?: boolean | ""
    empty?: string
  }
  const flag = (v: unknown) => v === "" || v === true || v === "true"
  const groups = (hex: string) => hex.match(/.{1,4}/g) ?? []
  $: all = groups(hash)
  $: shown = flag(full) || all.length <= 4 ? all : [all[0], all[1], "…", all[all.length - 1]]
</script>

<span :if="hash" class="hash" :class.full="flag(full)" :title="hash">
  <svg class="link" viewBox="0 0 16 16" aria-hidden="true">
    <rect x="1.5" y="5" width="7" height="6" rx="2" />
    <rect x="7.5" y="5" width="7" height="6" rx="2" />
  </svg>
  <span :each="group in shown" class="group" :class.gap="group === '…'">{{ group }}</span>
  <span class="copy">{{ hash }}</span>
</span>
<span :else class="hash none">{{ empty }}</span>

<style scoped>
  .hash {
    display: inline-flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: .35em;
    max-width: 100%;
    color: var(--vc-fg-muted);
    font-family: var(--vc-font-mono);
    font-size: var(--vc-text-xs);
    letter-spacing: .02em;
    vertical-align: middle;
  }
  .full { flex-wrap: wrap; }
  .group { white-space: nowrap; }
  .gap { color: var(--vc-fg-subtle); }
  .none { font-family: var(--vc-font-sans); font-style: italic; }
  .link {
    flex: none;
    width: 1.3em;
    height: 1.3em;
    fill: none;
    stroke: var(--vc-accent);
    stroke-width: 1.4;
  }
  /* Not shown, but selected and copied with the groups: the whole value in
     one piece, without the spaces between groups. */
  .copy {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .group, .gap, .link { user-select: none; }
</style>
