<script :setup="{ items = [] }: ChainProps" lang="ts">
  // The chain of Veri*factu records: each record a block, as in the logo,
  // joined to the one before it. A block is filled with its tone (accepted,
  // pending, rejected), and carries its title, a detail line, a status on
  // the right and its hash.
  //
  //   <Chain :items="invoice.records.map(r => ({
  //     key: r.id, title: t.detail.recordType[r.record_type],
  //     detail: r.generated_at, hash: r.hash,
  //     status: t.aeatState[r.aeat.state], tone: toneOf(r.aeat.state),
  //   }))" />
  //
  // The texts come in the items: the component writes none. Part of the
  // theme: imports nothing, draws only with tokens.
  interface ChainItem {
    key: string | number
    title: string
    detail?: string
    status?: string
    hash?: string
    tone?: "neutral" | "accent" | "ok" | "warn" | "bad"
  }
  interface ChainProps {
    items?: ChainItem[]
  }
  const short = (hash: string) => hash ? `${hash.slice(0, 8)}…${hash.slice(-4)}` : ""
</script>

<ol class="chain">
  <li :each="item in items" :key="item.key" class="link" :class="'tone-' + (item.tone || 'neutral')">
    <span class="block" aria-hidden="true"></span>
    <div class="text">
      <div class="line">
        <strong class="title">{{ item.title }}</strong>
        <span :if="item.status" class="status">{{ item.status }}</span>
      </div>
      <span :if="item.detail" class="detail">{{ item.detail }}</span>
      <code :if="item.hash" class="hash" :title="item.hash">{{ short(item.hash || "") }}</code>
    </div>
  </li>
</ol>
