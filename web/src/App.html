<script :setup="{ api, t, describeError }: Props" lang="ts">
  import type { Api, ApiError } from "./api"
  import type { Texts } from "./i18n/es"
  import type { Shell } from "./types"

  interface Props {
    api: Api
    t: Texts
    describeError: (t: Texts, error: unknown) => string
  }

  type View = "loading" | "sign-in" | "invoices" | "contacts" | "settings"

  const Invoices = await import("./Invoices.html")
  const Contacts = await import("./Contacts.html")
  const Settings = await import("./Settings.html")

  let view: View = "loading"
  let username = ""
  let credentials = { username: "", password: "" }
  let error = ""
  let busy = false

  // Given to every screen: how to report an error and how to clear it.
  const shell: Shell = {
    fail: (e: unknown) => {
      const { status, code } = e as Partial<ApiError>
      if (status === 401 && view !== "sign-in") view = "sign-in"
      if (code === "company_missing") view = "settings"
      error = describeError(t, e)
    },
    clear: () => {
      error = ""
    },
  }

  const go = (next: View) => {
    error = ""
    view = next
  }
  const signIn = async () => {
    busy = true
    error = ""
    try {
      username = (await api.signIn(credentials.username, credentials.password)).username
      credentials = { username: "", password: "" }
      view = "invoices"
    } catch (e) {
      error = describeError(t, e)
    } finally {
      busy = false
    }
  }
  const signOut = async () => {
    try {
      await api.signOut()
    } catch (e) {
      shell.fail(e)
      return
    }
    username = ""
    go("sign-in")
  }

  await $mounted()
  try {
    username = (await api.session()).username
    view = "invoices"
  } catch {
    view = "sign-in"
  }
</script>

<header class="bar">
  <h1>{{ t.appName }}</h1>
  <button :if="username && view !== 'sign-in'" @click="signOut">{{ t.signOut }}</button>
</header>

<p :if="error" class="error" role="alert">{{ error }}</p>

<main :if="view === 'sign-in'">
  <h2>{{ t.signIn.title }}</h2>
  <form @submit.prevent="signIn">
    <label>{{ t.signIn.username }}
      <input required autocomplete="username" autocapitalize="none" :value="credentials.username"
        @input="credentials.username = $event.target.value">
    </label>
    <label>{{ t.signIn.password }}
      <input required type="password" autocomplete="current-password" :value="credentials.password"
        @input="credentials.password = $event.target.value">
    </label>
    <button type="submit" class="primary" :disabled="busy">{{ t.signIn.submit }}</button>
  </form>
</main>

<main :if="view === 'invoices'"><Invoices :api :t :shell /></main>
<main :if="view === 'contacts'"><Contacts :api :t :shell /></main>
<main :if="view === 'settings'"><Settings :api :t :shell /></main>

<nav :if="view === 'invoices' || view === 'contacts' || view === 'settings'" class="tabs">
  <button :class.on="view === 'invoices'" @click="go('invoices')">{{ t.nav.invoices }}</button>
  <button :class.on="view === 'contacts'" @click="go('contacts')">{{ t.nav.contacts }}</button>
  <button :class.on="view === 'settings'" @click="go('settings')">{{ t.nav.settings }}</button>
</nav>
