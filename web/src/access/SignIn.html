<script :setup="{ api, t, shell, webauthn, done }: Props" lang="ts">
  import type { Api } from "../app/api"
  import type { Texts } from "../i18n/es"
  import type { Session } from "./types"
  import type { Shell } from "../app/types"
  import type { WebAuthn } from "./webauthn"

  interface Props {
    api: Api
    t: Texts
    shell: Shell
    webauthn: WebAuthn
    /// Called once the user is signed in.
    done: (session: Session) => void
  }

  // Sign-up and sign-in are the same flow: an invited user's first
  // sign-in creates their account.
  let step: "email" | "code" | "offer" = "email"
  let email = ""
  let code = ""
  let busy = false
  let session: Session | null = null
  let waitSeconds = 0
  const supported = webauthn.supported()

  // A pending passkey request for the email field's autofill.
  let autofill: AbortController | null = null
  const stopAutofill = () => {
    autofill?.abort()
    autofill = null
  }

  let timer: number | undefined
  const startCountdown = () => {
    waitSeconds = 60
    window.clearInterval(timer)
    timer = window.setInterval(() => {
      waitSeconds -= 1
      if (waitSeconds <= 0) window.clearInterval(timer)
    }, 1000)
  }

  const run = async (action: () => Promise<void>) => {
    busy = true
    shell.clear()
    try {
      await action()
    } catch (e) {
      shell.fail(e)
    } finally {
      busy = false
    }
  }

  const finish = (signedIn: Session) => {
    stopAutofill()
    window.clearInterval(timer)
    // Offer a passkey to whoever signs in with a code and has none.
    if (signedIn.passkeys === 0 && supported) {
      session = signedIn
      step = "offer"
    } else {
      done(signedIn)
    }
  }

  const sendCode = () => run(async () => {
    stopAutofill()
    email = email.trim().toLowerCase()
    await api.requestCode(email)
    code = ""
    step = "code"
    startCountdown()
  })
  const resend = () => run(async () => {
    await api.requestCode(email)
    startCountdown()
  })
  const submitCode = () => run(async () => {
    finish(await api.signIn(email, code.trim()))
  })
  const otherEmail = () => {
    shell.clear()
    window.clearInterval(timer)
    step = "email"
    startAutofill()
  }
  const withPasskey = () => run(async () => {
    stopAutofill()
    try {
      finish(await webauthn.signIn(api))
    } catch (e) {
      startAutofill()
      throw e
    }
  })
  const createPasskey = () => run(async () => {
    await webauthn.register(api, t.access.defaultName(webauthn.deviceName()))
    if (session) done({ ...session, passkeys: 1 })
  })
  const notNow = () => {
    shell.clear()
    if (session) done(session)
  }

  // Lets the browser offer saved passkeys in the email field. It waits in
  // the background until the user picks one or the request is stopped.
  const startAutofill = async () => {
    if (autofill || !(await webauthn.autofillAvailable())) return
    const controller = new AbortController()
    autofill = controller
    try {
      finish(await webauthn.signIn(api, true, controller.signal))
    } catch (e) {
      // Stopped on purpose, dismissed, or no passkeys on this device:
      // nothing to report, the email field still works.
      const code = (e as { code?: string }).code
      if (!controller.signal.aborted && code !== "passkey_cancelled" && code !== "passkey_unsupported") {
        shell.fail(e)
      }
    } finally {
      if (autofill === controller) autofill = null
    }
  }

  await $mounted()
  startAutofill()
</script>

<h2>{{ t.signIn.title }}</h2>

<div :if="step === 'email'">
  <p>{{ t.signIn.intro }}</p>
  <form @submit.prevent="sendCode">
    <label>{{ t.signIn.email }}
      <input required type="email" autocomplete="email webauthn" autocapitalize="none" :value="email"
        @input="email = $event.target.value">
    </label>
    <button type="submit" class="primary" :disabled="busy">{{ t.signIn.sendCode }}</button>
  </form>
  <div :if="supported">
    <p class="muted separator">{{ t.signIn.or }}</p>
    <button type="button" :disabled="busy" @click="withPasskey">{{ t.signIn.withPasskey }}</button>
  </div>
  <p class="muted">{{ t.signIn.invitedOnly }}</p>
</div>

<div :if="step === 'code'">
  <p role="status">{{ t.signIn.codeSent(email) }}</p>
  <form @submit.prevent="submitCode">
    <label>{{ t.signIn.code }}
      <input required inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
        :value="code" @input="code = $event.target.value">
    </label>
    <button type="submit" class="primary" :disabled="busy">{{ t.signIn.submit }}</button>
  </form>
  <p>
    <button type="button" :disabled="busy || waitSeconds > 0" @click="resend">{{ t.signIn.resend }}</button>
    <button type="button" :disabled="busy" @click="otherEmail">{{ t.signIn.otherEmail }}</button>
  </p>
  <p :if="waitSeconds > 0" class="muted">{{ t.signIn.resendIn(waitSeconds) }}</p>
</div>

<div :if="step === 'offer'">
  <p :if="session && session.first_sign_in" class="notice" role="status">{{ t.signIn.welcome }}</p>
  <h3>{{ t.signIn.offerTitle }}</h3>
  <p>{{ t.signIn.offer }}</p>
  <button type="button" class="primary" :disabled="busy" @click="createPasskey">{{ t.signIn.createPasskey }}</button>
  <button type="button" :disabled="busy" @click="notNow">{{ t.signIn.notNow }}</button>
</div>
