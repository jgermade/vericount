<script :setup="{ api, t, shell }: Props" lang="ts">
  import type { Api } from "./api"
  import type { Texts } from "./i18n/es"
  import type { Contact, ContactInput, Shell } from "./types"

  interface Props { api: Api; t: Texts; shell: Shell }

  const emptyForm = (): ContactInput => ({
    name: "", nif: "", address: "", postal_code: "", city: "", email: "",
    is_customer: true, is_supplier: false, archived: false,
  })

  let contacts: Contact[] = []
  let loaded = false
  // `null` while the list is shown; 0 for a new contact.
  let editing: number | null = null
  let form: ContactInput = emptyForm()
  let busy = false

  const run = async (action: () => Promise<void>) => {
    busy = true
    shell.clear()
    try {
      await action()
    } catch (e) {
      shell.fail(e)
    } finally {
      busy = false
    }
  }

  const load = () => run(async () => {
    contacts = await api.listContacts()
    loaded = true
    editing = null
  })
  const startNew = () => {
    shell.clear()
    form = emptyForm()
    editing = 0
  }
  const startEdit = (contact: Contact) => {
    shell.clear()
    const { id, invoices, ...fields } = contact
    form = { ...fields }
    editing = id
  }
  const save = () => run(async () => {
    if (editing) await api.updateContact(editing, form)
    else await api.createContact(form)
    contacts = await api.listContacts()
    editing = null
  })

  await $mounted()
  load()
</script>

<section :if="editing === null">
  <div class="bar">
    <h2>{{ t.contacts.title }}</h2>
    <button class="primary" @click="startNew">{{ t.contacts.new }}</button>
  </div>
  <p :if="loaded && !contacts.length" class="muted">{{ t.contacts.empty }}</p>
  <ul class="list">
    <li :each="contact in contacts" :key="contact.id">
      <button class="row" @click="startEdit(contact)">
        <span>
          <strong>{{ contact.name }}</strong>
          <span :if="contact.is_customer" class="tag accepted">{{ t.contacts.customerTag }}</span>
          <span :if="contact.is_supplier" class="tag pending">{{ t.contacts.supplierTag }}</span>
          <span :if="contact.archived" class="tag">{{ t.contacts.archivedTag }}</span>
          <br>
          <span class="muted">{{ contact.nif }} · {{ contact.city }}</span>
        </span>
        <span class="muted">{{ t.contacts.invoices(contact.invoices) }}</span>
      </button>
    </li>
  </ul>
</section>

<section :else>
  <div class="bar">
    <h2>{{ editing ? t.contacts.edit : t.contacts.new }}</h2>
    <button @click="editing = null">{{ t.cancel }}</button>
  </div>
  <form @submit.prevent="save">
    <label>{{ t.contacts.name }}
      <input required :value="form.name" @input="form.name = $event.target.value">
    </label>
    <label>{{ t.contacts.nif }}
      <input required maxlength="9" autocapitalize="characters" :value="form.nif"
        @input="form.nif = $event.target.value">
    </label>
    <label>{{ t.contacts.address }}
      <input autocomplete="street-address" :value="form.address" @input="form.address = $event.target.value">
    </label>
    <div class="columns two">
      <label>{{ t.contacts.postalCode }}
        <input inputmode="numeric" maxlength="5" :value="form.postal_code"
          @input="form.postal_code = $event.target.value">
      </label>
      <label>{{ t.contacts.city }}
        <input :value="form.city" @input="form.city = $event.target.value">
      </label>
    </div>
    <label>{{ t.contacts.email }}
      <input type="email" :value="form.email" @input="form.email = $event.target.value">
    </label>
    <label class="check">
      <input type="checkbox" :checked="form.is_customer" @change="form.is_customer = $event.target.checked">
      {{ t.contacts.customer }}
    </label>
    <label class="check">
      <input type="checkbox" :checked="form.is_supplier" @change="form.is_supplier = $event.target.checked">
      {{ t.contacts.supplier }}
    </label>
    <label :if="editing" class="check">
      <input type="checkbox" :checked="form.archived" @change="form.archived = $event.target.checked">
      {{ t.contacts.archived }}
    </label>
    <button type="submit" class="primary" :disabled="busy">{{ t.save }}</button>
  </form>
</section>
