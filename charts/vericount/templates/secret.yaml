{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vericount.fullname" . }}
  labels:
    {{- include "vericount.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "database.url is required (or existingSecret)" .Values.database.url | quote }}
  migration-database-url: {{ required "database.migrationUrl is required (or existingSecret)" .Values.database.migrationUrl | quote }}
  {{- with .Values.smtp.url }}
  smtp-url: {{ . | quote }}
  {{- end }}
  {{- /* Generated once and kept on upgrades: the stored AEAT certificate
         cannot be read without it. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "vericount.fullname" .) }}
  {{- if .Values.secretKey }}
  secret-key: {{ .Values.secretKey | quote }}
  {{- else if and $existing (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" | b64dec | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | sha256sum | quote }}
  {{- end }}
{{- end }}
