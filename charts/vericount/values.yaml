image:
  repository: ghcr.io/jgermade/vericount
  # The chart's appVersion by default.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Where users open vericount, e.g. https://books.example.com. Required.
# Passkeys are bound to its host name, so it must be https and a domain.
publicUrl: ""

# PostgreSQL is external: e.g. an operator such as PGO (which uses
# pgBackRest) or a managed service. Two connections are needed:
#   url           the server's login role, e.g. vericount
#   migrationUrl  the role that owns the schema, used by the migration
#                 init container before the server starts. The first
#                 migration creates the role vericounts_app, so on the first
#                 install the owner needs CREATEROLE (it can be revoked after).
# The init container makes appRole, the role of url, a member of
# vericounts_app, which may only read and insert.
database:
  url: ""
  migrationUrl: ""
  appRole: vericount

# Mail for sign-in codes and invitations; required when aeat.environment
# is production. E.g. smtps://user:password@smtp.example.com
smtp:
  url: ""
  from: ""

# 64 hexadecimal digits (openssl rand -hex 32) that encrypt the AEAT
# certificate uploaded in the settings. Generated on install and kept on
# upgrades when empty. Without it, the stored certificate cannot be read:
# keep a copy with the database backups.
secretKey: ""

# Instead of the values above, an existing Secret with the keys
# database-url, migration-database-url, secret-key and, optionally,
# smtp-url.
existingSecret: ""

# vericount starts in practice mode: invoices are not real and records go
# to a mock inside the server. Live mode is turned on in the settings,
# after uploading the certificate there.
aeat:
  # Where live records go: "test" (the AEAT pre-production service) or
  # "production".
  environment: test
  # Only in the test environment, e.g. a mock.
  endpoint: ""
  representative:
    name: ""
    nif: ""
  # Producer of the software, declared in every record. Required for
  # live mode.
  softwareProducer:
    name: ""
    nif: ""
  installationNumber: "1"

# More environment variables for the server container.
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the host of publicUrl.
  host: ""
  # e.g. [{ secretName: vericount-tls, hosts: [books.example.com] }]
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
