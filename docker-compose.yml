# vericount with PostgreSQL. Copy .env.example to .env, fill it in, then:
#
#   docker compose up -d
#   docker compose run --rm app invite you@example.com
#
# The client listens on 127.0.0.1:8080; put an HTTPS reverse proxy in front
# of it and set VERICOUNT_PUBLIC_URL to its address.

x-image: &image ${VERICOUNT_IMAGE:-ghcr.io/jgermade/vericount:latest}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vericount
      POSTGRES_USER: vericount_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VERICOUNT_DB_PASSWORD: ${VERICOUNT_DB_PASSWORD:?set VERICOUNT_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vericount_owner -d vericount"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies the migrations with the owner role, makes the server's role a
  # member of vericounts_app, then exits.
  migrate:
    image: *image
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://vericount_owner:${POSTGRES_PASSWORD}@db/vericount
      VERICOUNT_APP_ROLE: vericount
    depends_on:
      db:
        condition: service_healthy

  app:
    image: *image
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VERICOUNT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://vericount:${VERICOUNT_DB_PASSWORD}@db/vericount
      VERICOUNT_PUBLIC_URL: ${VERICOUNT_PUBLIC_URL:-http://localhost:8080}
      VERICOUNT_SMTP_URL: ${VERICOUNT_SMTP_URL:-}
      VERICOUNT_MAIL_FROM: ${VERICOUNT_MAIL_FROM:-}
      VERICOUNT_AEAT_ENV: ${VERICOUNT_AEAT_ENV:-test}
      VERICOUNT_AEAT_SUBMIT: ${VERICOUNT_AEAT_SUBMIT:-}
      VERICOUNT_AEAT_IDENTITY_PEM: ${VERICOUNT_AEAT_IDENTITY_PEM:-}
      VERICOUNT_AEAT_REPRESENTATIVE_NAME: ${VERICOUNT_AEAT_REPRESENTATIVE_NAME:-}
      VERICOUNT_AEAT_REPRESENTATIVE_NIF: ${VERICOUNT_AEAT_REPRESENTATIVE_NIF:-}
      VERICOUNT_SOFTWARE_PRODUCER_NAME: ${VERICOUNT_SOFTWARE_PRODUCER_NAME:-}
      VERICOUNT_SOFTWARE_PRODUCER_NIF: ${VERICOUNT_SOFTWARE_PRODUCER_NIF:-}
    volumes:
      # The AEAT client certificate, if any: set VERICOUNT_AEAT_IDENTITY_PEM
      # to /run/secrets/aeat/identity.pem and put the file in ./secrets.
      - ./secrets:/run/secrets/aeat:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
