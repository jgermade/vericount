[package]
name = "vericounts-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "migrate", "macros", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = "1"
vericounts-core = { path = "../core" }
# Passkeys. Registration and sign-in state is kept in the database between
# the two requests of each ceremony, which needs state serialisation.
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }

x509-parser = "0.17"

[dev-dependencies]
rcgen = "0.13"
vericounts-aeat-mock = { path = "../aeat-mock" }
http-body-util = "0.1"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
